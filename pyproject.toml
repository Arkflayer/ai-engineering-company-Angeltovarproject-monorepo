[project]
name = "trackflow-test-runner"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "api",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false
constraint-dependencies = [
    "fastapi==0.162.0",
    "starlette==1.9.0",
]

[tool.uv.sources]
api = { path = "services/api" }

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
pythonpath = ["services/api"]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
]
