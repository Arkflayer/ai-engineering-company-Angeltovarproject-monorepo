[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "email-validator>=2.2,<3",
    "fastapi>=0.110,<1.0",
    "libpass[bcrypt]>=1.9.4",
    "python-dotenv>=1.0,<2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.9",
    "tinydb>=4.8,<5",
    "uvicorn[standard]>=0.27,<1.0",
]

[dependency-groups]
dev = ["httpx>=0.27,<1.0"]
